<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>يومي مع الصلاة</title>
<script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__dp=e;if(window.__onDp)window.__onDp()});</script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--tx:#1d2a24;--mut:#6b776f;--pri:#0f7a4d;--acc:#d63a3a;--ln:#e4e0d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--tx:#eef3ef;--mut:#9aaaa0;--pri:#3ecf8e;--acc:#ff6b6b;--ln:#2a3a31}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--tx:#eef3ef;--mut:#9aaaa0;--pri:#3ecf8e;--acc:#ff6b6b;--ln:#2a3a31}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7;max-width:760px;margin:auto;padding:12px 12px 96px}
.top{display:flex;align-items:center;justify-content:space-between}.top>*+*{margin-right:8px}
.top h1{margin:0;font-size:22px;text-align:center;flex:1;min-width:0}
.top small{display:block;font-size:13px;color:var(--mut);font-weight:400}
.nav{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;margin:12px 0;padding-bottom:4px}.tabs>*+*{margin-right:6px}
.tab{flex:1 0 auto;min-width:64px;white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 4px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stagew{width:100%;max-width:340px;margin:8px auto}
.stage{position:relative;width:100%;height:0;padding-bottom:100%}
.core{position:absolute;top:22%;left:22%;right:22%;bottom:22%;border-radius:50%;background:var(--card);border:2px solid var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.core svg{position:absolute;top:-2px;left:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg)}
.core h2{margin:0;font-size:24px;position:relative;line-height:1.3}
.core .tm{font-size:15px;font-weight:700;color:var(--pri);cursor:pointer;position:relative}
.core .row{display:flex;justify-content:center;font-size:12px;position:relative;margin-top:3px}
.core button.sm{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;font-size:11px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.plus{position:absolute;left:50%;bottom:calc(22% - 20px);margin-left:-20px;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-size:26px;line-height:1;cursor:pointer;z-index:2}
.dot{position:absolute;width:16%;height:16%;border-radius:50%;border:2.5px solid var(--acc);background:var(--card);color:var(--tx);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);overflow:hidden;line-height:1.1}
.dot.done{background:var(--pri);border-color:var(--pri);color:#fff}
.lock{text-align:center;color:var(--pri);font-weight:700;min-height:28px}
.hint{font-size:12.5px;color:var(--mut);text-align:center;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px;margin-top:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px;color:var(--pri)}
.card p{margin:4px 0;font-size:14.5px}
.src{font-size:12px;color:var(--mut)}
.share{border:1px dashed var(--pri);background:none;color:var(--pri);border-radius:10px;font:inherit;font-size:12.5px;padding:3px 10px;cursor:pointer;margin-top:4px}
.cnt{display:flex;align-items:center;justify-content:space-between}.cnt>*+*{margin-right:8px}
.cnt button.c{width:76px;height:76px;border-radius:50%;border:3px solid var(--pri);background:var(--card);color:var(--tx);font:inherit;font-size:24px;font-weight:700;cursor:pointer;flex:none}
.cnt button.c.ok{background:var(--pri);color:#fff}
.reset{border:0;background:none;color:var(--mut);font-size:12px;cursor:pointer}
.ban{position:fixed;left:12px;right:12px;bottom:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--pri);color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.25)}.ban>*+*{margin-right:10px}
.ban.show{display:flex}.ban div{flex:1;font-size:14px}
.ban button{border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;flex:none}
#go{background:#fff;color:var(--pri);font-weight:700}#no{background:transparent;color:#fff}
.toast{position:fixed;top:10px;top:calc(10px + env(safe-area-inset-top,0px));left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:92%;text-align:center;background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:10}

.az{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:6px;gap:6px;margin:14px 0 4px}
.azc{position:relative;width:100%;height:0;padding:0 0 100%;border:0;background:none;cursor:pointer;color:var(--tx);font:inherit}
.azc svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.azc .in{position:absolute;top:7%;left:7%;right:7%;bottom:7%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.35}
.azc b{font-size:11px}.azc small{font-size:10px;color:var(--mut)}
.azc.qr .in{border:0}.azc.qr b{color:var(--pri)}.azc.qr.all b{color:#fff}
.qi{display:block;padding:12px 14px 14px}.qi .bd{display:block}
.qh{font-size:13px;color:var(--mut);text-align:center;border-bottom:1px solid var(--ln);padding-bottom:4px;margin-bottom:6px}
.qt{font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic","Geeza Pro",serif;font-size:23px;line-height:2.5;text-align:justify;-webkit-text-align-last:center;text-align-last:center;word-spacing:1px;-webkit-user-select:text;user-select:text}
.qt .sh{display:block;text-align:center;font-size:20px;font-weight:700;color:var(--pri);border:1.5px solid var(--pri);border-radius:12px;margin:10px 0 2px;line-height:2}
.qt .bs{display:block;text-align:center;font-size:22px;line-height:2.3}
.qt .an{color:var(--pri);font-size:19px}
.qb{display:block;width:100%;margin-top:10px;border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:14px;padding:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.qi.ok .qb{background:var(--pri);color:#fff}
.khm{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.khm.show{display:flex}
.khb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px 12px;max-width:760px;width:100%;margin:0 auto;text-align:center}
.khb h2{margin:6px 0;font-size:24px;color:var(--pri)}.khb .sb{color:var(--mut);font-size:14px;margin:0 0 14px}
.khb .du{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:2.1;text-align:right}
.khf{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}
.khf button{width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-size:16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.khf button.g{background:none;color:var(--pri);border:1px dashed var(--pri);font-size:14px;font-weight:400;margin-bottom:8px}
.mot{margin:10px 0 4px}.mot textarea{width:100%;display:block;resize:none;overflow:hidden;border:1.5px dashed var(--pri);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;font-size:16px;font-weight:600;line-height:1.7;text-align:center;min-height:58px}
.mot textarea::placeholder{color:var(--mut);font-weight:400}
.dn{border:1px solid var(--pri);background:none;color:var(--pri);border-radius:10px;font:inherit;font-size:13px;padding:4px 14px;cursor:pointer;margin-top:4px}.dn.on{background:var(--pri);color:#fff}
.dd{margin-top:10px}
.azc.all .in{background:var(--pri);color:#fff}.azc.all small{color:#e6f4ec}
.azm{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.azm.show{display:flex}
.azh{display:flex;align-items:center;padding:10px 12px}.azh>*+*{margin-right:10px}
.azh .t{flex:1;text-align:center;min-width:0}.azh .t b{display:block;font-size:18px}.azh .t small{color:var(--mut);font-size:13px}
.azh button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:14px;padding:8px 12px;cursor:pointer;flex:none}
.azb{height:6px;background:var(--ln);margin:0 12px;border-radius:3px;overflow:hidden}.azb i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
#azl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}
.it{display:flex;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.it>*+*{margin-right:12px}
.it .bd{flex:1;min-width:0}
.it .tx{font-size:17px;line-height:2}
.it .nt{font-size:12px;color:var(--mut)}
.it .ct{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--pri);color:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px;line-height:1}
.it .ct small{font-size:10px;font-weight:400;margin-top:2px}
.it:active{transform:scale(.99)}
.it.ok{opacity:.55;border-color:var(--pri)}.it.ok .ct{background:var(--pri);color:#fff}
.it .rs{border:0;background:none;color:var(--mut);font-size:12px;cursor:pointer;padding:0}
.prs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 6px}
.pr{border:1.5px solid var(--ln);background:var(--card);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.pr b{display:block;font-size:14px}.pr .ptm{display:inline-block;font-size:12px;color:var(--mut);padding:2px 6px}
.pr.now{border-color:var(--pri)}.pr.on{background:var(--pri);border-color:var(--pri);color:#fff}.pr.on .ptm{color:#e6f4ec}
.ctl{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.ctl .sm{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
.mid{display:flex;flex-direction:column;align-items:center;margin:14px 0;min-height:120px}
.addb{width:64px;height:64px;border-radius:50%;border:3px solid var(--acc);background:var(--card);color:var(--acc);font-size:38px;line-height:1;padding:0;cursor:pointer}
.tks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;width:100%}
.tk{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--acc);border-radius:22px;padding:8px 14px;font-size:15px;cursor:pointer;-webkit-user-select:none;user-select:none}
.tk.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tk{transition:transform .65s ease-out,opacity .65s ease-out,filter .65s ease-out,background .2s,color .2s}
.tk.poof{background:var(--pri);border-color:var(--pri);color:#fff;opacity:0;filter:blur(8px);transform:translateY(-34px) scale(1.25)}
.tkx{border:0;background:none;color:inherit;opacity:.6;font-size:13px;cursor:pointer;padding:0 2px}
</style>
</head>
<body>
<div class="top"><h1 id="dt">…<small id="hj"></small></h1></div>
<div class="mot"><textarea id="mot" rows="2" placeholder="اكتب هنا جملتك التحفيزية…" aria-label="جملتي التحفيزية"></textarea></div>
<div class="prs" id="prs"></div>
<div class="ctl"><button class="sm" id="snd"></button><button class="sm" id="rm"></button></div>
<div class="mid"><button class="addb" id="add" aria-label="إضافة مهمة">+</button><div class="tks" id="tks"></div></div>

<div class="az" id="az"></div>
<div class="azm" id="azm"><div class="azh"><button id="azx">✕ إغلاق</button><div class="t"><b id="azt"></b><small id="azp"></small></div><button id="azr">إعادة</button></div><div class="azb"><i id="azbar"></i></div><div id="azl"></div></div>

<div class="grid">
  <div class="card" id="vs"></div>
  <div class="card" id="hd"></div>
  <div class="card" id="lv"></div>
  <div class="card" id="fb"></div>
</div>
<div class="grid" id="cn"></div>
<div class="card dd" id="dd"></div>

<div class="khm" id="khm"><div class="khb"><div style="font-size:46px">🌙</div><h2>تقبل الله، ختمت القرآن الكريم</h2><p class="sb" id="khs"></p>
<div class="du" id="khd"></div></div>
<div class="khf"><button class="g" id="khc">نسخ الدعاء</button><button id="khn">آمين، نبدأ ختمة جديدة من الفاتحة</button></div></div>

<div class="ban" id="ban"><div id="bt">ضيف التطبيق على شاشة جهازك</div><button id="go">تثبيت التطبيق</button><button id="no">لاحقًا</button></div>
<div class="toast" id="ts"></div>

<script src="quran.js" defer></script>
<script>
const $=s=>document.querySelector(s);
const P=[["fajr","الفجر","04:35"],["dhuhr","الظهر","11:50"],["asr","العصر","14:55"],["maghrib","المغرب","17:10"],["isha","العشاء","18:30"]];
const V=[
["﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾","البقرة: 152","من ذكر الله بقلبه ولسانه ذكره الله بالرحمة والتوفيق والثناء في الملأ الأعلى."],
["﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾","الرعد: 28","الطمأنينة الحقيقية تأتي من ذكر الله وحده، فهو دواء القلق والهم."],
["﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا﴾","الطلاق: 2","من اتقى الله بفعل أوامره واجتناب نواهيه فرّج الله عنه كل ضيق."],
["﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾","الشرح: 5","وعد من الله أن بعد كل شدة فرجًا، ويسرًا يصاحب العسر."],
["﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾","البقرة: 45","الصبر والصلاة خير معين للمؤمن على أمور الدنيا والآخرة."],
["﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾","طه: 114","أمر الله نبيه أن يطلب الزيادة من العلم، وهو دليل فضل العلم والدعاء بطلبه."],
["﴿ادْعُونِي أَسْتَجِبْ لَكُمْ﴾","غافر: 60","وعد من الله بإجابة الدعاء لمن دعاه بإخلاص."]];
const H=[
["«إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى»","متفق عليه","صحة العمل وقبوله مرتبطان بالنية، فاجعل نيتك لله في كل عمل حتى المباحات."],
["«من دلّ على خير فله مثل أجر فاعله»","رواه مسلم","من أرشد غيره لطاعة أو علم نافع نال مثل أجره دون أن ينقص من أجر الفاعل."],
["«أحب الأعمال إلى الله أدومها وإن قل»","متفق عليه","القليل الدائم خير من الكثير المنقطع، فداوم على ورد صغير."],
["«الكلمة الطيبة صدقة»","متفق عليه","كل كلمة طيبة تدخل بها السرور على أحد لك بها أجر الصدقة."],
["«تبسمك في وجه أخيك لك صدقة»","رواه الترمذي","حتى البسمة الصادقة من أبواب الخير والأجر."],
["«من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى الجنة»","رواه مسلم","طلب العلم الشرعي سبب لتيسير طريق الجنة."],
["«لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»","متفق عليه","كمال الإيمان أن تحب الخير لإخوانك كما تحبه لنفسك."]];
const L=[
["الرفق","«إن الله رفيق يحب الرفق في الأمر كله» (متفق عليه)"],
["التوبة والتطهر","﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ (البقرة: 222)"],
["الإحسان","﴿وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ﴾ (البقرة: 195)"],
["الصبر","﴿وَاللَّهُ يُحِبُّ الصَّابِرِينَ﴾ (آل عمران: 146)"],
["التوكل","﴿إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾ (آل عمران: 159)"],
["العدل","﴿وَأَقْسِطُوا إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾ (الحجرات: 9)"],
["المداومة على العمل","«أحب الأعمال إلى الله أدومها وإن قل» (متفق عليه)"]];
const F=[
["الغيبة","﴿وَلَا يَغْتَب بَّعْضُكُم بَعْضًا﴾ (الحجرات: 12)"],
["الكذب","«إن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار» (متفق عليه)"],
["الربا","﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾ (البقرة: 275)"],
["النميمة","«لا يدخل الجنة نمّام» (متفق عليه)"],
["إيذاء الجار","«والله لا يؤمن... الذي لا يأمن جاره بوائقه» (متفق عليه)"],
["الظلم","«يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرمًا» (رواه مسلم)"],

// فتح التطبيق دايمًا على النهارده (وعلى الصلاة الجاية)
function curIdx(){const now=new Date(),m=now.getHours()*60+now.getMinutes(),t=times(now);let r=0;
  for(let i=0;i<P.length;i++){const [h,mi]=t[P[i][0]].split(":").map(Number);if(h*60+mi<=m)r=i}return r}
let loadKey=key(new Date()),hiddenAt=0;
function goToday(){off=0;cur=curIdx();loadKey=key(new Date());render()}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now()}
  else{ctx();if(key(new Date())!==loadKey||(hiddenAt&&Date.now()-hiddenAt>3e4))goToday();else render();tick()}});
setInterval(()=>{if(key(new Date())!==loadKey)goToday()},30000);

// مواعيد القاهرة: بنجيب الشهر الحالي والجاي ونخزنهم، فتشتغل أوفلاين بنفس المواعيد
function loadCal(){const n=new Date(),nx=new Date(n.getFullYear(),n.getMonth()+1,1);
  Promise.all([[n.getFullYear(),n.getMonth()+1],[nx.getFullYear(),nx.getMonth()+1]].map(a=>
    fetch("https://api.aladhan.com/v1/calendarByCity/"+a[0]+"/"+a[1]+"?city=Cairo&country=Egypt&method=5").then(r=>r.json()).then(j=>j.data).catch(()=>null)
  )).then(r=>{
    const cal=Object.assign({},S.cal),lim=iso(dk(-2));let ok=0;
    r.forEach(arr=>{if(!Array.isArray(arr))return;ok++;arr.forEach(x=>{const g=x.date.gregorian.date.split("-"),T=x.timings;
      cal[g[2]+"-"+g[1]+"-"+g[0]]={fajr:T.Fajr.slice(0,5),dhuhr:T.Dhuhr.slice(0,5),asr:T.Asr.slice(0,5),maghrib:T.Maghrib.slice(0,5),isha:T.Isha.slice(0,5)}})});
    if(!ok)return;Object.keys(cal).forEach(k=>{if(k<lim)delete cal[k]});S.cal=cal;
    const td=cal[iso(new Date())];if(td)S.tm=Object.assign({},td);
    save();render()}).catch(()=>{})}
loadCal();

// تثبيت التطبيق
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let dp=window.__dp||null;
const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
let dismissed=false;try{dismissed=Date.now()-(+localStorage.getItem("noinst")||0)<864e5}catch(e){}
function showBan(txt,btn){if(standalone||dismissed)return;$("#bt").textContent=txt;$("#go").style.display=btn?"":"none";$("#ban").classList.add("show")}
function hideBan(){$("#ban").classList.remove("show")}
function offerInstall(){dp=window.__dp;showBan("ثبّت «يومي» كتطبيق على جهازك، يشتغل أونلاين وأوفلاين",true)}
window.__onDp=offerInstall;
window.addEventListener("appinstalled",()=>{dp=null;hideBan();toast("تم تثبيت التطبيق ✅ ويشتغل بدون نت")});
$("#go").onclick=()=>{
  if(!dp){return}
  try{dp.prompt();dp.userChoice.then(r=>{dp=null;window.__dp=null;hideBan()},()=>{})}catch(e){hideBan()}
};
$("#no").onclick=()=>{hideBan();try{localStorage.setItem("noinst",String(Date.now()))}catch(e){}};
if(dp)offerInstall();
else if(/iphone|ipad|ipod/i.test(navigator.userAgent))showBan("للإضافة: اضغط زر المشاركة ⎙ ثم «إضافة إلى الشاشة الرئيسية»",false);
else setTimeout(()=>{if(!dp)showBan("للإضافة: من قائمة المتصفح ⋮ اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»",false)},3000);
try{if("Notification" in window&&Notification.permission==="default")document.addEventListener("click",()=>Notification.requestPermission(),{once:true})}catch(e){}
const mt=$("#mot");mt.value=S.mot||"";
const grow=()=>{mt.style.height="auto";mt.style.height=mt.scrollHeight+"px"};
mt.addEventListener("input",()=>{S.mot=mt.value;save();grow()});window.addEventListener("load",grow);window.addEventListener("resize",grow);
try{if(navigator.serviceWorker)navigator.serviceWorker.ready.then(()=>{if(!localStorage.getItem("offok")){localStorage.setItem("offok","1");toast("التطبيق جاهز للعمل بدون إنترنت ✅")}})}catch(e){}
$("#khn").onclick=hideKhatm;
$("#khc").onclick=()=>{const t=KHATM.join("\n");if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast("تم نسخ الدعاء"),()=>{})}};
cur=curIdx();render();grow();document.addEventListener("DOMContentLoaded",()=>{if(!azSc)render()});if(S.q.pend)showKhatm();
</script>
